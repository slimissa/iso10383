name: Setup Python with project dependencies
description: Install Python 3.12 and every dependency in requirements-dev.txt.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        python3 -m pip install --upgrade pip
        pip install -r requirements-dev.txt