name: refresh

on:
  schedule:
    - cron: "0 0 15 * *"     # 00:00 UTC on the 15th of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -c constraints.txt jsonschema pyarrow pytest pyyaml

      - name: Compute refresh identifiers
        id: refresh
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download current SWIFT file
        run: python3 -c "from tools.fetch_swift_mic import download; download(force=True, target=__import__('pathlib').Path('raw/MIC_new.csv'))"

      - name: Snapshot the old registry
        run: cp iso10383.json /tmp/iso10383.old.json

      - name: Regenerate
        run: |
          python3 tools/fetch_swift_mic.py \
            --raw raw/MIC_new.csv \
            --version "$(cat VERSION)" \
            --snapshot-date "${{ steps.refresh.outputs.date }}"

      - name: Diff
        id: diff
        run: |
          # Capture the tool's exit code directly. Piping through
          # tee would give tee's exit code, not the tool's.
          # See RELEASE_PATTERN.md operator-hygiene rule 5.
          set +e
          python3 tools/refresh_diff.py /tmp/iso10383.old.json iso10383.json \
            > /tmp/diff.txt 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/diff.txt
          exit 0

      - name: Regenerate artifacts
        run: |
          python3 tools/export_csv.py
          python3 tools/export_sql.py
          python3 tools/export_parquet.py
          python3 tools/sync_wrappers.py

      - name: Validate
        run: |
          python3 tools/validate.py
          python3 tools/check_version_consistency.py
          python3 -m pytest tests/ -q --deselect tests/test_readme_figures.py::test_readme_figures_match_data

      - name: Docs check (advisory)
        id: docs
        run: |
          # Advisory on purpose: a refresh always changes counts, so stale docs must not stop the PR from opening.
          # They turn it into a draft with a warning. A manifest --check is NOT used here: it is always STALE until release.sh regenerates it.
          set +e
          python3 -m pytest tests/test_readme_figures.py -q > /tmp/figs.txt 2>&1
          echo "figs=$?" >> "$GITHUB_OUTPUT"
          python3 tools/check_release_claims.py "$(cat VERSION)" > /tmp/claims.txt 2>&1
          echo "claims=$?" >> "$GITHUB_OUTPUT"
          tail -25 /tmp/figs.txt; tail -8 /tmp/claims.txt
          exit 0
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh/${{ steps.refresh.outputs.month }}
          title: "Refresh: ISO 10383 snapshot ${{ steps.refresh.outputs.date }}"
          body: |
            Automated monthly refresh.

            ${{ steps.diff.outputs.code == '1' && '**REMOVED > 0. This draft requires human confirmation before merge.**' || 'No removals. Safe to review.' }}
            The removed MICs and the full diff are in the workflow log (step "Diff").
            ${{ steps.docs.outputs.figs != '0' && '**README figures are stale (tests/test_readme_figures.py fails). Fix the docs before releasing.**' || 'README figures match the data.' }}

            **Before merging:**
            - Review the diff in the workflow log.
            - If `REMOVED > 0`, confirm the removal is intentional.
            - Add a `CHANGELOG.md` entry.
          draft: ${{ steps.diff.outputs.code == '1' || steps.docs.outputs.figs != '0' }}
          commit-message: "Refresh: ISO 10383 snapshot"
          delete-branch: true
