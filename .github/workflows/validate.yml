name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: python3 tools/validate.py
      - run: python3 tools/check_version_consistency.py
      - run: python3 tools/check_snapshot_freshness.py
      - run: python3 tools/check_iso3166_current.py
      - run: python3 tools/check_exchange_calendar_current.py
      - run: python3 tools/check_iso4217_current.py
      - run: python3 -m pytest tests/ -q

  check-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: python3 tools/export_csv.py --check
      - run: python3 tools/export_sql.py --check
      - run: python3 tools/export_parquet.py --check
      - run: python3 tools/sync_wrappers.py --check

  check-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: python3 tools/iso10383_cli.py check
      - run: python3 -m pytest tests/test_cli.py -q

  check-wrappers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            setup: pip install -e wrappers/python
            test: python3 -m pytest wrappers/python/tests -q
          - lang: javascript
            setup: "true"
            test: cd wrappers/javascript && node --test
          - lang: rust
            setup: "true"
            test: cd wrappers/rust && cargo test --quiet
          - lang: go
            setup: "true"
            test: cd wrappers/go && go test ./... -count=1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - run: ${{ matrix.setup }}
      - run: ${{ matrix.test }}

  check-cross-language:
    needs: check-wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e wrappers/python
      - run: bash tools/check_cross_language.sh
