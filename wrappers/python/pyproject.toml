[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso10383-registry"
version = "0.1.0"
description = "ISO 10383 Market Identifier Codes - canonical, versioned, machine-readable registry"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Le P'tit", email = "slimissabara@gmail.com"}]
keywords = ["iso10383", "mic", "market-identifier", "exchange", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/slimissa/iso10383"
Issues   = "https://github.com/slimissa/iso10383/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iso10383 = ["data/*.json"]
